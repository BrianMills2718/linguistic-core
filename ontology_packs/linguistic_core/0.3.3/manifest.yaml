pack:
  id: linguistic_core
  version: 0.3.3
  name: linguistic_core
  description: 'Relation layer for linguistic_core, extending 0.3.2. Declares predicate-to-predicate relations, role correspondences derived from PropBank argument positions, and symmetric role pairs. Adds no predicates, roles, or types: every id here is defined by an ancestor pack.'
build:
  compiler_version: linguistic-core-relation-layer-v1
  built_at: '2026-09-08T00:00:00Z'
extends:
- id: linguistic_core
  version: 0.3.2
capabilities:
  assertion_type: n-ary
  type_system: sumo
content:
  entity_types: entity_types.jsonl
  predicate_types: predicate_types.jsonl
  role_types: role_types.jsonl
  value_types: value_types.jsonl
  hierarchy_edges: hierarchy_edges.jsonl
  predicate_role_edges: predicate_role_edges.jsonl
  source_mappings: source_mappings.jsonl
  aliases: aliases.jsonl
  constraints: constraints.jsonl
  predicate_relations: predicate_relations.jsonl
  role_correspondences: role_correspondences.jsonl
  symmetric_role_pairs: symmetric_role_pairs.jsonl
