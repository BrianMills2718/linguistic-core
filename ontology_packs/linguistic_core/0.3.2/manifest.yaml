pack:
  id: linguistic_core
  version: 0.3.2
  name: linguistic_core
  description: 'Additive relations slice for linguistic_core, extending 0.3.1. Compiles SUMO relations and their positional argument-type constraints from sumo_plus.db''s relations/relation_constraints tables (unread by the base compiler), filtered to SUMO modules cleared for publication per docs/runs/artifacts/plan0147_sumo_module_publication_v2.json (45 of 66 modules approved). Excludes SUO-KIF Functions (*Fn) and relation IDs that collide with an existing linguistic_core predicate name. Provides 1061 new lc: relation predicates (kinship, spatial, semiotic, and other general relations) with generic positional role slots (lc.role.relation_arg1..N, N = max arity in this slice). Attribution: derived from the SUMO (Suggested Upper Merged Ontology) project by Adam Pease / Articulate Software and named module contributors (github.com/ontologyportal/sumo); see ADR-0040 for the per-module license basis and the GPL-compatible open-terms condition this pack''s own publication satisfies.'
build:
  compiler_version: linguistic-core-relations-slice-v1
  built_at: '2026-09-03T00:00:00Z'
  source_inputs:
  - system: onto_canon_sumo_plus_relations
    version: '2026-02-15'
    path: data/sumo_plus.db
    tables: relations, relation_constraints, type_ancestors, type_hierarchy
  - system: sumo_module_publication_disposition
    version: '2'
    path: docs/runs/artifacts/plan0147_sumo_module_publication_v2.json
extends:
- id: linguistic_core
  version: 0.3.1
capabilities:
  assertion_type: n-ary
  type_system: sumo
content:
  entity_types: entity_types.jsonl
  predicate_types: predicate_types.jsonl
  role_types: role_types.jsonl
  value_types: value_types.jsonl
  hierarchy_edges: hierarchy_edges.jsonl
  predicate_role_edges: predicate_role_edges.jsonl
  source_mappings: source_mappings.jsonl
  aliases: aliases.jsonl
  constraints: constraints.jsonl
