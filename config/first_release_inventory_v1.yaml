coverage_rules:
  - construction: verbal_predicates
    default: {status: selected_unmeasured, source_keys: [propbank_frames_34, framenet_17, sumo_root_kif], note: "All three selected inventories can contribute, but M3 must disposition records per domain."}
  - construction: nominal_references
    default: {status: explicit_gap, source_keys: [], note: No nominal donor component is selected; NomBank remains internal-only and unselected.}
  - construction: adjectival_state_predication
    default: {status: selected_unmeasured, source_keys: [framenet_17, sumo_root_kif], note: Frame and ontology fields are selected; record-level domain coverage is unmeasured.}
  - construction: light_verb_constructions
    default: {status: selected_unmeasured, source_keys: [propbank_frames_34, framenet_17], note: Rolesets and frames are selected; construction-level coverage remains an M3 disposition.}
  - construction: alternations_converses
    default: {status: selected_unmeasured, source_keys: [framenet_17], note: Directional frame and frame-element relations are selected; mappings remain unreviewed.}
  - construction: negation_modality_aspect
    default: {status: contract_only, source_keys: [], note: "M1 represents scope distinctions, but no selected donor field supplies a complete inventory."}
  - construction: quantities_comparisons
    default: {status: contract_only, source_keys: [], note: "M1 represents quantification, but the selected donors have no audited construction inventory."}
    domain_overrides:
      measurement: {status: selected_unmeasured, source_keys: [sumo_root_kif], note: SUMO relation and constraint fields are selected for measurement coverage disposition in M3.}
  - construction: temporal_scope
    default: {status: contract_only, source_keys: [], note: "M1 represents temporal scope, but no selected donor field supplies a complete temporal construction inventory."}
  - construction: generic_kind_claims
    default: {status: selected_unmeasured, source_keys: [sumo_root_kif], note: "SUMO type, instance, and hierarchy assertions are selected; linguistic realization remains unmeasured."}
  - construction: nested_attributed_claims
    default: {status: contract_only, source_keys: [], note: "M1 separates propositions, assertions, attribution, and support, but no selected donor component inventories nesting."}
